name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test (self-hosted macOS)
    # Self-hosted runner on a public repo: never run fork PRs here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ry-local, zora]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build:backend

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Security wiring audit
        run: bash scripts/security-audit.sh

  e2e:
    name: E2E Scenarios (self-hosted macOS)
    # Self-hosted runner on a public repo: never run fork PRs here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ry-local, zora]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build:backend

      - name: E2E scenario tests
        run: npm run test:e2e
        env:
          ZORA_E2E: '1'
