# Copy this file to ~/.zora/routines/ and restart the daemon.
# Requires a provider named "ollama" with cost_tier = "free" in config.toml —
# `zora-agent init` does not generate one. Add it, or change these two lines.

[routine]
name = "repo-cleanup"
schedule = "0 9 * * 1-5"
model_preference = "ollama"
max_cost_tier = "free"
timeout = "15m"

[task]
prompt = """
Check all git repos in ~/Projects for stale branches (>30 days),
uncommitted changes, and repos behind their remote.
Write summary to ~/.zora/workspace/daily/{date}-repo-status.md
and send a macOS notification with the highlight.
"""
